<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#030609"
>

<title>TYSON PULLBACK V1.2</title>


<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#030609;
  --panel:#0b131e;
  --border:rgba(145,177,219,.18);
  --text:#f5f8fc;
  --muted:#8999af;
  --green:#49df8d;
  --red:#ff616d;
  --blue:#65aaff;
  --cyan:#50dadd;
  --gold:#ffcc67;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(55,111,201,.18),
      transparent 31%
    ),
    linear-gradient(
      180deg,
      #07101b,
      #030609 45%,
      #020406
    );
}

.app{
  width:min(1180px,100%);
  margin:auto;
  padding:22px 14px 80px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  margin-bottom:22px;
}

.logo{
  font-weight:950;
  letter-spacing:.12em;
  font-size:clamp(23px,5vw,38px);
}

.subtitle{
  color:var(--muted);
  font-size:13px;
  margin-top:6px;
}

.badge{
  padding:11px 14px;
  border:1px solid var(--border);
  border-radius:999px;
  color:#9eacc0;
  background:rgba(2,7,12,.7);
  font-size:10px;
}

.panel{
  margin-bottom:20px;
  padding:20px;
  border-radius:27px;
  border:1px solid var(--border);

  background:
    linear-gradient(
      145deg,
      rgba(15,24,37,.97),
      rgba(6,11,18,.97)
    );

  box-shadow:
    0 20px 60px rgba(0,0,0,.26);
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}

.title{
  margin:0;
  color:#bec9d9;
  font-size:15px;
  letter-spacing:.14em;
}

.small{
  color:var(--muted);
  font-size:11px;
}

.best{
  font-size:clamp(38px,8vw,68px);
  font-weight:950;
  letter-spacing:-.04em;
  color:var(--green);
  margin:4px 0 17px;
}

.mode-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.mode-card{
  border:1px solid var(--border);
  border-radius:19px;
  background:rgba(3,8,14,.54);
  padding:16px;
}

.mode-name{
  color:var(--blue);
  font-weight:900;
  letter-spacing:.08em;
  margin-bottom:13px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.stat{
  padding:10px;
  border-radius:12px;
  background:rgba(0,0,0,.18);
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:9px;
  text-transform:uppercase;
}

.stat b{
  display:block;
  margin-top:5px;
  font-size:15px;
}

.validation{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid rgba(255,255,255,.06);
}

.validation-title{
  color:#9caac0;
  font-size:10px;
  letter-spacing:.08em;
  margin-bottom:8px;
}

.tf-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:11px;
}

.tf{
  padding:15px;
  border:1px solid var(--border);
  border-radius:17px;
  background:rgba(3,8,14,.52);
}

.tf h3{
  margin:0 0 8px;
  color:var(--blue);
  font-size:13px;
}

.tf-state{
  font-weight:850;
  margin-bottom:8px;
}

.line{
  display:flex;
  justify-content:space-between;
  gap:7px;
  padding:4px 0;
  color:var(--muted);
  font-size:11px;
}

.line b{
  color:#e4eaf3;
}

.bull{
  color:var(--green);
}

.bear{
  color:var(--red);
}

.neutral{
  color:var(--gold);
}

.metrics{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:11px;
}

.metric{
  padding:15px;
  border-radius:17px;
  border:1px solid var(--border);
  background:rgba(3,8,14,.53);
}

.metric span{
  color:var(--muted);
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.06em;
}

.metric b{
  display:block;
  margin-top:7px;
  font-size:19px;
}

.chart{
  height:260px;
  border-radius:17px;
  border:1px solid var(--border);
  overflow:hidden;
  background:rgba(2,6,10,.55);
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

.table-wrap{
  overflow:auto;
  border:1px solid var(--border);
  border-radius:17px;
}

table{
  width:100%;
  min-width:880px;
  border-collapse:collapse;
  background:rgba(3,8,14,.45);
}

th,td{
  padding:12px 13px;
  text-align:left;
  border-bottom:1px solid rgba(255,255,255,.05);
  font-size:12px;
}

th{
  color:#8f9eb3;
  font-size:10px;
  letter-spacing:.06em;
  text-transform:uppercase;
}

.tag{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  font-size:10px;
  font-weight:900;
}

.buy{
  color:var(--green);
  background:rgba(73,223,141,.1);
}

.sell{
  color:var(--red);
  background:rgba(255,97,109,.1);
}

.status{
  padding:13px;
  border:1px solid var(--border);
  border-radius:14px;
  color:#91a1b5;
  background:rgba(0,0,0,.17);
}

.status.good{
  color:#92efba;
  border-color:rgba(73,223,141,.3);
}

@media(max-width:900px){

  .mode-grid{
    grid-template-columns:1fr;
  }

  .tf-grid{
    grid-template-columns:1fr 1fr;
  }

  .metrics{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:560px){

  .app{
    padding:17px 11px 60px;
  }

  .panel{
    padding:17px;
    border-radius:23px;
  }

  .metrics{
    grid-template-columns:1fr 1fr;
  }

}

</style>

</head>

<body>

<div class="app">


<div class="header">

  <div>

    <div class="logo">
      TYSON PULLBACK AI
    </div>

    <div class="subtitle">
      XAU/USD Strategy Laboratory
    </div>

  </div>

  <div class="badge">
    V1.2 · 3 MODES
  </div>

</div>


<section class="panel">

  <div class="title-row">

    <h2 class="title">
      BEST MODE
    </h2>

    <span
      class="small"
      id="period"
    >
      —
    </span>

  </div>

  <div
    id="bestMode"
    class="best"
  >
    LOADING
  </div>

  <div
    id="bestMetrics"
    class="metrics"
  >
  </div>

</section>


<section class="panel">

  <div class="title-row">

    <h2 class="title">
      STRICT VS BALANCED VS ACTIVE
    </h2>

    <span class="small">
      SAME DATA
    </span>

  </div>

  <div
    id="modeGrid"
    class="mode-grid"
  >
  </div>

</section>


<section class="panel">

  <div class="title-row">

    <h2 class="title">
      CURRENT MARKET STRUCTURE
    </h2>

    <span
      id="marketTime"
      class="small"
    >
      —
    </span>

  </div>

  <div
    id="bias"
    class="best neutral"
  >
    —
  </div>

  <div
    id="tfGrid"
    class="tf-grid"
  >
  </div>

</section>


<section class="panel">

  <div class="title-row">

    <h2 class="title">
      BEST MODE EQUITY
    </h2>

    <span class="small">
      FIXED 0.5% RISK
    </span>

  </div>

  <div class="chart">
    <canvas id="chart"></canvas>
  </div>

</section>


<section class="panel">

  <div class="title-row">

    <h2 class="title">
      BEST MODE TRADES
    </h2>

    <span class="small">
      MOST RECENT FIRST
    </span>

  </div>

  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th>Side</th>
          <th>Score</th>
          <th>Entry Time</th>
          <th>Entry</th>
          <th>SL</th>
          <th>TP</th>
          <th>Exit</th>
          <th>Net R</th>
          <th>Result</th>

        </tr>

      </thead>

      <tbody id="tradeBody">
      </tbody>

    </table>

  </div>

</section>


<div
  id="status"
  class="status"
>
  Loading…
</div>


</div>


<script>

const $ =
  id =>
    document.getElementById(id);


let dataCache =
  null;


function num(
  value,
  decimals = 2
){

  if(
    value === null ||
    value === undefined ||
    !Number.isFinite(
      Number(value)
    )
  ){
    return "—";
  }


  return Number(value)
    .toLocaleString(
      undefined,
      {
        minimumFractionDigits:
          decimals,

        maximumFractionDigits:
          decimals
      }
    );

}


function dateText(value){

  if(!value){
    return "—";
  }


  return new Date(value)
    .toLocaleString();

}


/* =========================================================
   LOAD
========================================================= */

async function load(){

  try{

    const response =
      await fetch(
        "/api/backtest?bars=4500&targetR=1.8&riskPct=0.5",
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        "Backtest failed"
      );

    }


    dataCache =
      data;


    render(data);


    $("status")
      .className =
        "status good";


    $("status")
      .textContent =
        `Backtest complete · best mode ${data.bestMode}`;


  }catch(error){

    $("status")
      .textContent =
        error.message;

  }

}


/* =========================================================
   RENDER
========================================================= */

function render(data){

  $("bestMode")
    .textContent =
      data.bestMode;


  $("period")
    .textContent =
      `${dateText(data.period.start)} → ${dateText(data.period.end)}`;


  renderBest(
    data.best.metrics
  );


  renderModes(
    data.modes
  );


  renderMarket(
    data.latest
  );


  renderTrades(
    data.trades
  );


  drawChart(
    data.best.metrics
      .equityCurve
  );

}


/* =========================================================
   BEST METRICS
========================================================= */

function renderBest(m){

  const values = [

    ["Trades",m.trades],

    [
      "Win Rate",
      `${num(m.winRate,1)}%`
    ],

    [
      "Profit Factor",
      num(m.profitFactor,2)
    ],

    [
      "Expectancy",
      `${num(m.expectancyR,3)}R`
    ],

    [
      "Total R",
      `${num(m.totalR,2)}R`
    ],

    [
      "Max DD",
      `${num(m.maxDrawdown,2)}%`
    ],

    [
      "Return",
      `${num(m.returnPct,2)}%`
    ],

    [
      "Final Balance",
      num(m.finalBalance,2)
    ],

    [
      "Buy / Sell",
      `${m.buys} / ${m.sells}`
    ],

    [
      "Grade",
      m.grade
    ],

    [
      "Wins",
      m.wins
    ],

    [
      "Losses",
      m.losses
    ]

  ];


  const container =
    $("bestMetrics");


  container.innerHTML =
    "";


  for(
    const [
      label,
      value
    ] of values
  ){

    container.innerHTML += `

      <div class="metric">

        <span>
          ${label}
        </span>

        <b>
          ${value}
        </b>

      </div>

    `;

  }

}


/* =========================================================
   MODES
========================================================= */

function renderModes(modes){

  const grid =
    $("modeGrid");


  grid.innerHTML =
    "";


  for(
    const mode of modes
  ){

    const m =
      mode.metrics;


    const v =
      mode.validation;


    grid.innerHTML += `

      <div class="mode-card">

        <div class="mode-name">
          ${mode.mode}
        </div>

        <div class="stats">

          <div class="stat">
            <span>Trades</span>
            <b>${m.trades}</b>
          </div>

          <div class="stat">
            <span>Win Rate</span>
            <b>${num(m.winRate,1)}%</b>
          </div>

          <div class="stat">
            <span>PF</span>
            <b>${num(m.profitFactor,2)}</b>
          </div>

          <div class="stat">
            <span>Expectancy</span>
            <b>${num(m.expectancyR,3)}R</b>
          </div>

          <div class="stat">
            <span>Total</span>
            <b>${num(m.totalR,2)}R</b>
          </div>

          <div class="stat">
            <span>DD</span>
            <b>${num(m.maxDrawdown,2)}%</b>
          </div>

        </div>


        <div class="validation">

          <div class="validation-title">
            LAST 30% VALIDATION
          </div>

          <div class="stats">

            <div class="stat">
              <span>Trades</span>
              <b>${v.trades}</b>
            </div>

            <div class="stat">
              <span>PF</span>
              <b>${num(v.profitFactor,2)}</b>
            </div>

            <div class="stat">
              <span>Expectancy</span>
              <b>${num(v.expectancyR,3)}R</b>
            </div>

            <div class="stat">
              <span>Total</span>
              <b>${num(v.totalR,2)}R</b>
            </div>

          </div>

        </div>

      </div>

    `;

  }

}


/* =========================================================
   MARKET
========================================================= */

function renderMarket(latest){

  if(!latest){
    return;
  }


  $("bias")
    .textContent =
      latest.bias;


  $("bias")
    .className =
      `best ${
        latest.bias === "BULLISH"
          ? "bull"
          : latest.bias === "BEARISH"
            ? "bear"
            : "neutral"
      }`;


  $("marketTime")
    .textContent =
      dateText(
        latest.time
      );


  const grid =
    $("tfGrid");


  grid.innerHTML =
    "";


  const labels = {

    m5:"M5",
    m15:"M15",
    h1:"H1",
    h4:"H4"

  };


  for(
    const key of
    Object.keys(labels)
  ){

    const tf =
      latest.timeframes[key];


    const stateClass =
      tf.direction === "BULLISH"
        ? "bull"
        : tf.direction === "BEARISH"
          ? "bear"
          : "neutral";


    grid.innerHTML += `

      <div class="tf">

        <h3>
          ${labels[key]}
        </h3>

        <div class="tf-state ${stateClass}">
          ${tf.direction}
        </div>

        <div class="line">
          <span>Price</span>
          <b>${num(tf.price,2)}</b>
        </div>

        <div class="line">
          <span>EMA20</span>
          <b>${num(tf.ema20,2)}</b>
        </div>

        <div class="line">
          <span>EMA50</span>
          <b>${num(tf.ema50,2)}</b>
        </div>

        <div class="line">
          <span>EMA200</span>
          <b>${num(tf.ema200,2)}</b>
        </div>

        <div class="line">
          <span>RSI</span>
          <b>${num(tf.rsi,1)}</b>
        </div>

        <div class="line">
          <span>ADX</span>
          <b>${num(tf.adx,1)}</b>
        </div>

      </div>

    `;

  }

}


/* =========================================================
   TRADES
========================================================= */

function renderTrades(trades){

  const body =
    $("tradeBody");


  body.innerHTML =
    "";


  if(
    !trades.length
  ){

    body.innerHTML = `

      <tr>

        <td colspan="9">
          No trades.
        </td>

      </tr>

    `;

    return;

  }


  for(
    const trade of trades
  ){

    const cls =
      trade.side === "BUY"
        ? "buy"
        : "sell";


    const rcls =
      trade.netR > 0
        ? "bull"
        : trade.netR < 0
          ? "bear"
          : "neutral";


    body.innerHTML += `

      <tr>

        <td>
          <span class="tag ${cls}">
            ${trade.side}
          </span>
        </td>

        <td>
          ${trade.score}
        </td>

        <td>
          ${dateText(trade.entryTime)}
        </td>

        <td>
          ${num(trade.entry,2)}
        </td>

        <td>
          ${num(trade.stopLoss,2)}
        </td>

        <td>
          ${num(trade.target,2)}
        </td>

        <td>
          ${num(trade.exit,2)}
        </td>

        <td class="${rcls}">
          ${num(trade.netR,2)}R
        </td>

        <td class="${rcls}">
          ${trade.result}
        </td>

      </tr>

    `;

  }

}


/* =========================================================
   CHART
========================================================= */

function drawChart(curve){

  const canvas =
    $("chart");


  const parent =
    canvas.parentElement;


  const width =
    parent.clientWidth;


  const height =
    parent.clientHeight;


  const dpr =
    window.devicePixelRatio || 1;


  canvas.width =
    width * dpr;


  canvas.height =
    height * dpr;


  const ctx =
    canvas.getContext("2d");


  ctx.scale(
    dpr,
    dpr
  );


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  if(
    !curve ||
    curve.length < 2
  ){
    return;
  }


  const pad =
    25;


  const values =
    curve.map(
      x =>
        Number(x.equity)
    );


  let min =
    Math.min(...values);


  let max =
    Math.max(...values);


  if(
    min === max
  ){
    min -= 1;
    max += 1;
  }


  ctx.strokeStyle =
    "rgba(255,255,255,.055)";


  for(
    let i = 1;
    i <= 4;
    i++
  ){

    const y =
      pad +
      (
        height -
        pad * 2
      ) *
      i /
      4;


    ctx.beginPath();

    ctx.moveTo(
      pad,
      y
    );

    ctx.lineTo(
      width - pad,
      y
    );

    ctx.stroke();

  }


  const gradient =
    ctx.createLinearGradient(
      pad,
      0,
      width - pad,
      0
    );


  gradient.addColorStop(
    0,
    "#65aaff"
  );


  gradient.addColorStop(
    .5,
    "#50dadd"
  );


  gradient.addColorStop(
    1,
    "#49df8d"
  );


  ctx.strokeStyle =
    gradient;


  ctx.lineWidth =
    2.3;


  ctx.beginPath();


  curve.forEach(
    (
      point,
      i
    ) => {

      const x =
        pad +
        (
          i /
          (
            curve.length -
            1
          )
        ) *
        (
          width -
          pad * 2
        );


      const y =
        height -
        pad -
        (
          (
            point.equity -
            min
          ) /
          (
            max -
            min
          )
        ) *
        (
          height -
          pad * 2
        );


      if(
        i === 0
      ){

        ctx.moveTo(
          x,
          y
        );

      }else{

        ctx.lineTo(
          x,
          y
        );

      }

    }
  );


  ctx.stroke();

}


window.addEventListener(
  "resize",
  () => {

    if(
      dataCache
    ){

      drawChart(
        dataCache.best.metrics
          .equityCurve
      );

    }

  }
);


window.addEventListener(
  "load",
  load
);

</script>

</body>

</html>
